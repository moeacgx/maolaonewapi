<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宿主上下文探针</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --border: #d9dee8;
        --text: #1f2937;
        --muted: #667085;
        --soft: #f1f5f9;
        --primary: #2563eb;
        --success: #15803d;
        --warning: #b45309;
        --danger: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        padding: 20px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.25;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        padding: 0 12px;
      }
      button.primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
      }
      .value {
        margin-top: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
        font-weight: 700;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .badge.success {
        background: #dcfce7;
        color: var(--success);
      }
      .badge.warning {
        background: #fef3c7;
        color: var(--warning);
      }
      .badge.danger {
        background: #fee2e2;
        color: var(--danger);
      }
      pre {
        min-height: 320px;
        overflow: auto;
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #111827;
        color: #e5e7eb;
        padding: 14px;
        font-size: 12px;
        line-height: 1.55;
      }
      @media (max-width: 760px) {
        main {
          padding: 14px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .actions {
          width: 100%;
        }
        button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header">
        <div>
          <h1>宿主上下文探针</h1>
          <div class="muted">
            静态轻量模块，用于验证上传、启用、侧边栏入口和宿主登录上下文。
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="refresh">刷新上下文</button>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <div class="label">运行方式</div>
          <div class="value">
            <span class="badge success">主程序静态托管</span>
          </div>
        </section>
        <section class="card">
          <div class="label">当前用户</div>
          <div class="value" id="username">-</div>
        </section>
        <section class="card">
          <div class="label">用户分组</div>
          <div class="value" id="group">-</div>
        </section>
      </div>

      <pre id="output">正在读取宿主上下文...</pre>
    </main>

    <script>
      const output = document.getElementById('output')
      const username = document.getElementById('username')
      const group = document.getElementById('group')

      function render(value) {
        output.textContent = JSON.stringify(value, null, 2)
        username.textContent = value?.data?.username || '-'
        group.textContent = value?.data?.group || '-'
      }

      async function refreshContext() {
        const response = await fetch('/api/extensions/host/me', {
          headers: { Accept: 'application/json' },
          credentials: 'same-origin',
        })
        const value = await response.json()
        render(value)
      }

      document.getElementById('refresh').addEventListener('click', () => {
        refreshContext().catch((error) => {
          output.textContent = String(error?.stack || error)
        })
      })

      refreshContext().catch((error) => {
        output.textContent = String(error?.stack || error)
      })
    </script>
  </body>
</html>
